<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>追平 · 收入什么时候追上 token 消耗</title>
<style>
  :root{
    --bg:#0d1012; --line:rgba(255,255,255,.08); --line-2:rgba(255,255,255,.16);
    --ink:#e8e4dc; --mute:#9aa0a6; --faint:#6b7178;
    --hot:#ff5a1f; --hot-dim:#8a3416; --cool:#5fd3c4; --warn:#e2b04a;
  }
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%}
  body{
    background:radial-gradient(120% 80% at 50% 0%,#1a1d20 0%,var(--bg) 60%),var(--bg);
    color:var(--ink);font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
    display:grid;place-items:start center;padding:24px 16px 40px;overflow-y:auto;
  }
  body::after{content:"";position:fixed;inset:0;pointer-events:none;
    background-image:linear-gradient(rgba(255,255,255,.016) 1px,transparent 1px),
                     linear-gradient(90deg,rgba(255,255,255,.016) 1px,transparent 1px);
    background-size:44px 44px;mask-image:radial-gradient(70% 60% at 50% 40%,#000 0%,transparent 85%)}

  .bench{position:relative;width:min(820px,100%);
    background:linear-gradient(180deg,#1b1f23,#14171a);
    border:1px solid var(--line-2);border-radius:18px;
    box-shadow:0 30px 80px rgba(0,0,0,.65),inset 0 1px 0 rgba(255,255,255,.05);
    padding:22px 24px 18px}
  .screw{position:absolute;width:9px;height:9px;border-radius:50%;
    background:radial-gradient(circle at 35% 35%,#4a5056,#23272b 70%);box-shadow:inset 0 0 0 1px rgba(0,0,0,.6)}
  .screw.a{left:12px;top:12px}.screw.b{right:12px;top:12px}
  .screw.c{left:12px;bottom:12px}.screw.d{right:12px;bottom:12px}

  header{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:16px}
  h1{margin:0;font-size:16px;font-weight:600;letter-spacing:.02em}
  .tagline{font-size:12px;color:var(--mute);font-weight:400;margin-left:9px}
  .sub{font-size:12px;color:var(--mute)}
  .lamp{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--hot);
    box-shadow:0 0 10px var(--hot);margin-right:7px;vertical-align:1px}
  .lamp.off{background:#3a3f44;box-shadow:none}

  .display{position:relative;background:linear-gradient(180deg,#0a0c0e,#0e1114);
    border:1px solid #000;border-radius:12px;padding:18px 20px 14px;
    box-shadow:inset 0 2px 24px rgba(0,0,0,.9),inset 0 0 0 1px rgba(255,255,255,.03);
    margin-bottom:12px;overflow:hidden}
  .display::before{content:"";position:absolute;inset:0;pointer-events:none;
    background:repeating-linear-gradient(180deg,rgba(255,255,255,.02) 0 1px,transparent 1px 3px);opacity:.45}
  .label-row{display:flex;justify-content:space-between;font-size:11px;letter-spacing:.14em;color:var(--faint)}
  .money{font-family:ui-monospace,Consolas,"JetBrains Mono",Menlo,monospace;font-size:clamp(42px,8vw,62px);line-height:1;
    letter-spacing:-.02em;color:var(--hot);text-shadow:0 0 26px rgba(255,90,31,.32),0 0 60px rgba(255,90,31,.14);
    font-variant-numeric:tabular-nums;margin:9px 0 6px}
  .money .cur{font-size:.4em;vertical-align:.44em;opacity:.7;margin-right:5px}
  .tail{display:flex;gap:18px;flex-wrap:wrap;font-size:12px;color:var(--mute);font-variant-numeric:tabular-nums}
  .tail b{color:var(--ink);font-weight:500}
  .progress{margin-top:12px}
  .progress .bar{height:5px;border-radius:3px;background:#0a0c0e;overflow:hidden;box-shadow:inset 0 1px 3px rgba(0,0,0,.8)}
  .progress .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--hot-dim),var(--hot));transition:width .3s ease}
  .progress .meta{display:flex;justify-content:space-between;font-size:11px;color:var(--faint);margin-top:5px}

  .spend{background:#111417;border:1px solid var(--line);border-radius:12px;padding:14px 16px 12px;margin-bottom:12px}
  .spend .top{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
  .spend .k{font-size:11px;letter-spacing:.12em;color:var(--faint)}
  .spend .big{font-family:ui-monospace,Consolas,Menlo,monospace;font-size:26px;color:var(--cool);
    font-variant-numeric:tabular-nums;text-shadow:0 0 16px rgba(95,211,196,.25)}
  .spend .big i{font-style:normal;font-size:12px;color:var(--mute);margin-left:6px}
  .live-dot{display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--cool);
    margin-left:6px;vertical-align:middle;animation:blink 1.6s steps(1,end) infinite}
  @keyframes blink{0%,60%{opacity:1}61%,100%{opacity:.15}}
  .chain{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px;
    border-top:1px solid var(--line);padding-top:12px}
  .chain div{font-size:11px;color:var(--faint);line-height:1.7}
  .chain b{display:block;font-size:14px;color:var(--ink);font-weight:500;font-variant-numeric:tabular-nums;
    font-family:ui-monospace,Consolas,Menlo,monospace}
  .warn{margin-top:10px;font-size:11px;color:var(--warn);display:none}
  .warn.on{display:block}

  .verdict{margin:0 0 14px;font-size:13px;color:var(--mute);line-height:1.8}
  .verdict b{color:var(--ink);font-weight:600}
  .verdict .hot{color:var(--hot)}
  .verdict .cool{color:var(--cool)}

  .foot{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
  .btn{border:1px solid var(--line-2);background:transparent;color:var(--mute);
    border-radius:9px;padding:9px 14px;font:inherit;font-size:12px;cursor:pointer}
  .btn:hover{color:var(--ink);border-color:rgba(255,255,255,.28)}
  .btn:focus-visible{outline:2px solid var(--hot);outline-offset:2px}
  .primary{border:0;border-radius:10px;padding:11px 24px;font:inherit;font-size:13px;font-weight:600;
    background:linear-gradient(180deg,#ff6a33,#e8471a);color:#1a0d07;cursor:pointer;
    box-shadow:0 6px 20px rgba(255,90,31,.28),inset 0 1px 0 rgba(255,255,255,.3)}
  .primary.stop{background:linear-gradient(180deg,#2b3036,#22262b);color:#c9ced4;box-shadow:none}
  .hint{font-size:11px;color:var(--faint);margin:12px 0 0;line-height:1.7}

  .settings{display:none;margin-top:12px;padding:14px 16px;border:1px solid var(--line);border-radius:12px;background:#111417}
  .settings.on{display:block}
  .settings .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
  .settings label{display:block;font-size:11px;color:var(--faint);margin-bottom:5px}
  .settings input{width:100%;background:#0a0c0e;border:1px solid var(--line-2);border-radius:8px;
    color:var(--ink);padding:9px 10px;font:inherit;font-size:13px;font-variant-numeric:tabular-nums}
  .settings input:focus{outline:none;border-color:var(--hot)}
  .settings .row{display:flex;gap:10px;justify-content:flex-end;margin-top:12px}
  @media (max-width:620px){
    .settings .grid{grid-template-columns:1fr}
    .chain{grid-template-columns:1fr}
    .display .money{font-size:clamp(36px,12vw,52px)}
    .foot .primary{width:100%}
    h1 .tagline{display:block;margin:4px 0 0}
  }
</style>
</head>
<body>
<main class="bench">
  <i class="screw a"></i><i class="screw b"></i><i class="screw c"></i><i class="screw d"></i>

  <header>
    <h1><span class="lamp off" id="lamp"></span>追平<span class="tagline">收入什么时候追上 token 消耗</span></h1>
    <div class="sub" id="today">—</div>
  </header>

  <section class="display">
    <div class="label-row"><span id="stateText">未开工</span><span id="clock">--:--:--</span></div>
    <div class="money"><span class="cur">¥</span><span id="money">0.00</span></div>
    <div class="tail">
      <span>今日工时 <b id="hours">0.00</b> h</span>
      <span>时薪 <b id="hourly">0.00</b> 元</span>
      <span>日薪进度 <b id="progressPct">0%</b></span>
    </div>
    <div class="progress">
      <div class="bar"><i id="bar"></i></div>
      <div class="meta"><span>今日日薪 ¥<span id="dayPay">0</span></span><span id="goalPct">未开工</span></div>
    </div>
  </section>

  <section class="spend">
    <div class="top">
      <div>
        <div class="k">今日 TOKEN 花费 · 按日均推算</div>
        <div class="big">¥<span id="burnToday">—</span><span class="live-dot" id="dot" hidden></span></div>
      </div>
      <div style="text-align:right">
        <div class="k">本月 TOKEN 总额</div>
        <div class="big" id="tokTotal" style="color:var(--mute);font-size:19px">未填写</div>
      </div>
    </div>
    <div class="chain">
      <div>日均消耗<b id="daily">—</b></div>
      <div>平均每秒<b id="perSec">—</b></div>
      <div>每秒花费<b id="yuanPerSec">—</b></div>
    </div>
    <div class="warn" id="warn"></div>
  </section>

  <p class="verdict" id="verdict">先点「设置」填月薪，再点「填 token」记一笔本月消耗。</p>

  <div class="foot">
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <button class="btn" id="cfgBtn">设置</button>
      <button class="btn" id="tokBtn">填 token</button>
      <button class="btn" id="resetBtn">重置今日</button>
    </div>
    <button class="primary" id="mainBtn">开始上班</button>
  </div>

  <section class="settings" id="settings">
    <div class="grid">
      <div><label>月薪（元）</label><input id="inSalary" type="number" min="0" step="500" inputmode="numeric"></div>
      <div><label>每月工作天数</label><input id="inDays" type="number" min="1" step="0.25" inputmode="decimal"></div>
      <div><label>每天工时（小时）</label><input id="inHours" type="number" min="1" step="0.5" inputmode="decimal"></div>
      <div><label>token 单价（元 / 百万）</label><input id="inPrice" type="number" min="0" step="0.1" inputmode="decimal"></div>
      <div><label>本月 token 总额</label><input id="inTokens" type="number" min="0" step="1000" inputmode="numeric"></div>
      <div><label>&nbsp;</label><button class="btn" id="saveCfg" style="width:100%">保存</button></div>
    </div>
    <div class="row"><button class="btn" id="closeCfg">收起</button></div>
  </section>

  <p class="hint" id="hint">纯本地，不上传。工资按打卡秒数累计；token 按「月总额 ÷ 本月已过天数」的日均推算，不是实时读数。</p>
</main>

<script>
const KEY = 'zhuiping-v3';
const el = (id) => document.getElementById(id);
const pad = (n) => String(n).padStart(2, '0');
const dayKey = (d = new Date()) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const monthKey = (d = new Date()) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}`;
const num = (v, fallback, min = 0) => {
  const n = Number(v);
  return Number.isFinite(n) ? Math.max(min, n) : fallback;
};

const DEFAULTS = { monthlySalary: 20000, workDays: 21.75, hoursPerDay: 8, tokenPrice: 1 };
const blank = () => ({
  cfg: { ...DEFAULTS }, day: dayKey(), workedSec: 0, startedAt: null,
  month: monthKey(), tokens: 0, tokenAt: Date.now(), configured: false,
});

let storageOK = true;
try { localStorage.setItem('__probe', '1'); localStorage.removeItem('__probe'); }
catch { storageOK = false; }

function load() {
  if (!storageOK) return blank();
  try {
    const s = JSON.parse(localStorage.getItem(KEY));
    if (!s || typeof s !== 'object') return blank();
    const b = blank();
    return {
      cfg: {
        monthlySalary: num(s.cfg && s.cfg.monthlySalary, DEFAULTS.monthlySalary),
        workDays: num(s.cfg && s.cfg.workDays, DEFAULTS.workDays, 1),
        hoursPerDay: num(s.cfg && s.cfg.hoursPerDay, DEFAULTS.hoursPerDay, 1),
        tokenPrice: num(s.cfg && s.cfg.tokenPrice, DEFAULTS.tokenPrice),
      },
      day: typeof s.day === 'string' ? s.day : b.day,
      workedSec: num(s.workedSec, 0),
      startedAt: Number.isFinite(s.startedAt) ? s.startedAt : null,
      month: typeof s.month === 'string' ? s.month : b.month,
      tokens: num(s.tokens, 0),
      tokenAt: Number.isFinite(s.tokenAt) ? s.tokenAt : Date.now(),
      configured: !!s.configured || num(s.tokens, 0) > 0,
    };
  } catch { return blank(); }
}
function save() {
  if (!storageOK) return;
  try { localStorage.setItem(KEY, JSON.stringify(S)); } catch { storageOK = false; }
}

let S = load();
if (S.day !== dayKey()) { S.day = dayKey(); S.workedSec = 0; S.startedAt = null; }
if (S.month !== monthKey()) { S.month = monthKey(); S.tokens = 0; S.tokenAt = Date.now(); }

const running = () => S.startedAt !== null;
const salaryPerSec = () => S.cfg.monthlySalary / (S.cfg.workDays * S.cfg.hoursPerDay * 3600);
const salaryPerHour = () => salaryPerSec() * 3600;
const elapsedToday = () => S.workedSec + (running() ? (Date.now() - S.startedAt) / 1000 : 0);

/** 月总额 → 日均 → 每秒 → 金额。不满一天不出速率，避免月初数字暴涨。 */
function tokenStats() {
  if (!S.tokens) return { ready: false, reason: 'empty' };
  const at = new Date(S.tokenAt);
  const monthStart = new Date(at.getFullYear(), at.getMonth(), 1).getTime();
  const days = (S.tokenAt - monthStart) / 86400000;
  if (!(days >= 1)) return { ready: false, reason: 'young', days };
  const perDay = S.tokens / days;
  const perSec = perDay / 86400;
  return {
    ready: true, days, perDay, perSec,
    yuanPerDay: (perDay * S.cfg.tokenPrice) / 1e6,
    yuanPerSec: (perSec * S.cfg.tokenPrice) / 1e6,
  };
}

function fmtMoney(v, d = 2) {
  return v.toLocaleString('zh-CN', { minimumFractionDigits: d, maximumFractionDigits: d });
}
function fmtInt(v) { return Math.round(v).toLocaleString('zh-CN'); }
function fmtCompact(v) {
  if (v >= 1e8) return (v / 1e8).toFixed(2) + ' 亿';
  if (v >= 1e7) return (v / 1e4).toFixed(0) + ' 万';
  if (v >= 1e4) return (v / 1e4).toFixed(1) + ' 万';
  return fmtInt(v);
}

let lastState = '';
function render() {
  const secs = elapsedToday();
  const earned = secs * salaryPerSec();
  const dayPay = S.cfg.monthlySalary / S.cfg.workDays;
  const pct = dayPay > 0 ? Math.min(100, (earned / dayPay) * 100) : 0;

  el('money').textContent = fmtMoney(earned);
  el('hours').textContent = (secs / 3600).toFixed(2);
  el('hourly').textContent = fmtMoney(salaryPerHour());
  el('progressPct').textContent = pct.toFixed(0) + '%';
  el('bar').style.width = pct + '%';
  el('dayPay').textContent = fmtInt(dayPay);
  el('goalPct').textContent = running() ? '上班中' : '未开工';
  el('clock').textContent = new Date().toLocaleTimeString('zh-CN', { hour12: false });
  el('today').textContent = new Date().toLocaleDateString('zh-CN', { month: 'long', day: 'numeric', weekday: 'long' });

  const st = running() ? 'on' : 'off';
  if (st !== lastState) {
    lastState = st;
    el('stateText').textContent = running() ? '上班中' : '未开工';
    el('lamp').className = 'lamp' + (running() ? '' : ' off');
    el('mainBtn').textContent = running() ? '下班' : '开始上班';
    el('mainBtn').classList.toggle('stop', running());
  }

  const t = tokenStats();
  const now = new Date();
  const secsToday = Math.max(0, (now.getTime() - new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime()) / 1000);

  if (!t.ready) {
    el('burnToday').textContent = '—';
    el('tokTotal').textContent = S.tokens ? fmtCompact(S.tokens) + ' tokens' : '未填写';
    el('daily').textContent = '—';
    el('perSec').textContent = '—';
    el('yuanPerSec').textContent = '—';
    el('dot').hidden = true;
    el('warn').className = 'warn on';
    el('warn').textContent = t.reason === 'young'
      ? '本月数据不足一天，暂时不出速率；满 24 小时后自动开始推算。'
      : '还没填本月 token 总额，点「填 token」。';
    el('verdict').innerHTML = '工资在累计，消耗还没数据。填一个月总额，就能算出<b>赚的和烧的差多少</b>。';
    return;
  }

  const burnToday = t.yuanPerSec * secsToday;
  el('burnToday').textContent = burnToday < 0.01 ? burnToday.toFixed(6) : fmtMoney(burnToday);
  el('tokTotal').textContent = fmtCompact(S.tokens) + ' tokens';
  el('daily').textContent = fmtCompact(t.perDay) + ' / 天';
  el('perSec').textContent = Math.round(t.perSec) + ' / 秒';
  el('yuanPerSec').textContent = '¥' + t.yuanPerSec.toFixed(6);
  el('dot').hidden = false;
  el('warn').className = 'warn';
  el('warn').textContent = '';

  const mult = burnToday > 0 ? earned / burnToday : 0;
  const net = earned - burnToday;
  const per = t.yuanPerSec * 3600;
  el('verdict').innerHTML =
    `今天赚 <b class="hot">¥${fmtMoney(earned)}</b>，推算烧掉 <b class="cool">¥${burnToday < 0.01 ? burnToday.toFixed(6) : fmtMoney(burnToday)}</b> —— ` +
    `赚的是烧的 <b>${mult >= 100 ? Math.round(mult) : mult.toFixed(1)} 倍</b>，净入 <b>¥${fmtMoney(net)}</b>。` +
    `<br>时薪 <b>¥${fmtMoney(salaryPerHour())}</b>，每小时烧 <b>¥${per < 0.01 ? per.toFixed(6) : fmtMoney(per, 3)}</b>。`;
}

function syncInputs() {
  el('inSalary').value = S.cfg.monthlySalary;
  el('inDays').value = S.cfg.workDays;
  el('inHours').value = S.cfg.hoursPerDay;
  el('inPrice').value = S.cfg.tokenPrice;
  el('inTokens').value = S.tokens || '';
}

el('mainBtn').onclick = () => {
  if (running()) { S.workedSec = elapsedToday(); S.startedAt = null; }
  else { S.startedAt = Date.now(); }
  save(); render();
};

el('cfgBtn').onclick = () => { syncInputs(); el('settings').classList.toggle('on'); };
el('tokBtn').onclick = () => { syncInputs(); el('settings').classList.add('on'); el('inTokens').focus(); };
el('closeCfg').onclick = () => el('settings').classList.remove('on');

el('saveCfg').onclick = () => {
  const salary = num(el('inSalary').value, S.cfg.monthlySalary);
  const days = num(el('inDays').value, S.cfg.workDays, 1);
  const hours = num(el('inHours').value, S.cfg.hoursPerDay, 1);
  const price = num(el('inPrice').value, S.cfg.tokenPrice);
  const tokens = num(el('inTokens').value, S.tokens);
  const tokensChanged = tokens !== S.tokens;
  S.cfg = { monthlySalary: salary, workDays: days, hoursPerDay: hours, tokenPrice: price };
  S.tokens = tokens;
  if (tokensChanged || !S.configured) S.tokenAt = Date.now();
  S.configured = true;
  S.month = monthKey();
  save(); render();
  el('settings').classList.remove('on');
};

el('resetBtn').onclick = () => {
  if (!confirm('清空今天的工时？')) return;
  S.workedSec = 0; S.startedAt = null; save(); render();
};

addEventListener('storage', (e) => {
  if (e.key === KEY) { S = load(); render(); }
});

let lastSave = Date.now();
setInterval(() => {
  const dk = dayKey(), mk = monthKey();
  if (S.day !== dk) { S.day = dk; S.workedSec = 0; S.startedAt = null; }
  if (S.month !== mk) { S.month = mk; S.tokens = 0; S.tokenAt = Date.now(); }
  if (Date.now() - lastSave > 5000) { lastSave = Date.now(); save(); }
  render();
}, 200);

if (!storageOK) {
  el('hint').textContent = '当前浏览器不允许本地存储（可能是隐私模式），关闭页面后数据不会保留。';
  el('hint').style.color = 'var(--warn)';
}

syncInputs();
render();
</script>
</body>
</html>
